name: Snyk

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    env:
      # The secrets context can't be used in `if:`, so route it through env.
      # Absent for fork PRs and Dependabot PRs, which skip the scan.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when there is no SNYK_TOKEN
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::SNYK_TOKEN is not available, skipping the Snyk scan."
      - uses: actions/checkout@v7
        if: env.SNYK_TOKEN != ''
      - uses: snyk/actions/setup@v1.0.0
        if: env.SNYK_TOKEN != ''
      # Reads pnpm-lock.yaml, so no install is needed.
      - name: Fail on high or critical vulnerabilities
        if: env.SNYK_TOKEN != ''
        run: snyk test --severity-threshold=high
      - name: Track this snapshot in Snyk
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request'
        run: snyk monitor
