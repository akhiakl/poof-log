name: Quality Checks

# `push` is scoped to main so a PR branch runs once, via `pull_request`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck & Test (Node ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with "engines" in package.json (>=24).
        version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from package.json's "packageManager".
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.version }}
          cache: true
          install: false
      # Socket Firewall (free, no token) blocks malicious packages during the install below.
      - uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      # Each check tees its output to ci-results/ and keeps going on failure,
      # so the Quality Gate comment lists every failure at once.
      # v1.4.0, not the moving `v1` tag, which lags 12 commits behind it.
      - uses: akhiakl/ci-workflows@v1.4.0
        id: install
        with:
          name: install
          run: sfw pnpm install --frozen-lockfile
      - uses: akhiakl/ci-workflows@v1.4.0
        id: format
        continue-on-error: true
        with:
          name: format
          run: pnpm run format:check
      - uses: akhiakl/ci-workflows@v1.4.0
        id: lint
        continue-on-error: true
        with:
          name: lint
          run: pnpm run lint
      - uses: akhiakl/ci-workflows@v1.4.0
        id: typecheck
        continue-on-error: true
        with:
          name: typecheck
          run: pnpm run typecheck
      - uses: akhiakl/ci-workflows@v1.4.0
        id: test
        continue-on-error: true
        with:
          name: test
          run: >-
            pnpm run test --reporter=default --reporter=json
            --outputFile.json=ci-results/test-results.json
      - uses: akhiakl/ci-workflows@v1.4.0
        id: build
        continue-on-error: true
        with:
          name: build
          run: pnpm run build
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-node-${{ matrix.version }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if any check failed
        if: >-
          steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1

  # The one check to require in branch protection, plus the sticky PR comment.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [verify]
    # !cancelled(): still report failures, but don't overwrite the comment from a superseded run.
    # Not for Dependabot: its token is read-only, so the comment would fail with a 403.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: akhiakl/ci-workflows/gate@v1.4.0
        with:
          marker: '<!-- poof-log-quality-gate -->'
          title: Quality Gate
          status: |
            Lint, Typecheck & Test (Node 24 & 26)=${{ needs.verify.result }}
      - name: Fail if verify failed
        if: needs.verify.result != 'success'
        run: exit 1
