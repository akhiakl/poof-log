name: Quality Checks

# `push` is scoped to main so a PR branch runs once, via `pull_request`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck & Test (Node ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with "engines" in package.json (>=24).
        version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's version comes from package.json's "packageManager".
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.version }}
          cache: true
          install: false
      # Each check tees its output to ci-results/ and keeps going on failure,
      # so the Quality Gate comment lists every failure at once.
      # Pinned to v1.4.0's commit: the moving `v1` tag lags behind it.
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: install
        with:
          name: install
          run: pnpm install --frozen-lockfile
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: format
        continue-on-error: true
        with:
          name: format
          run: pnpm run format:check
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: lint
        continue-on-error: true
        with:
          name: lint
          run: pnpm run lint
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: typecheck
        continue-on-error: true
        with:
          name: typecheck
          run: pnpm run typecheck
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: test
        continue-on-error: true
        with:
          name: test
          run: >-
            pnpm run test --reporter=default --reporter=json
            --outputFile.json=ci-results/test-results.json
      - uses: akhiakl/ci-workflows@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        id: build
        continue-on-error: true
        with:
          name: build
          run: pnpm run build
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-node-${{ matrix.version }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail if any check failed
        if: >-
          steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1

  # The one check to require in branch protection, plus the sticky PR comment.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [verify]
    # !cancelled(): still report failures, but don't overwrite the comment from a superseded run.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: akhiakl/ci-workflows/gate@a3bacb0289be0bd6a0a37c18e801ac5ce1594b23 # v1.4.0
        with:
          marker: '<!-- poof-log-quality-gate -->'
          title: Quality Gate
          status: |
            Lint, Typecheck & Test (Node 24 & 26)=${{ needs.verify.result }}
      - name: Fail if verify failed
        if: needs.verify.result != 'success'
        run: exit 1
