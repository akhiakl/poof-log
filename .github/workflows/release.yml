name: Release

# Publishes to npm when a GitHub Release is published (see release-please.yml).
# Re-runs the checks first so a release can never skip them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re-)publish, e.g. v1.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Verify package.json version matches the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
      # Trusted publishing (OIDC) needs npm >= 11.5.1 and pnpm publish does not
      # support it yet, so publish with npm. No NPM_TOKEN is used.
      - name: Publish to npm
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public --provenance
